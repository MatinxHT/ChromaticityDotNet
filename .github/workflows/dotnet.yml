name: .NET Build and Release

on:
  push:
    branches: [ master ]
    # Shared assets/branding changes still trigger package validation.
    paths-ignore:
      - 'apps/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Do not interrupt a run between publishing the packages and their release.
concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release

    env:
      PACKAGE_IDS: >-
        ChromaticityDotNet
        ChromaticityDotNet.OxyplotDiagram
        ChromaticityDotNet.AvaloniaDiagram

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ChromaticityDotNet.sln

      - name: Verify CIE reference data and generated constants
        run: |
          python3 tools/cie_reference.py verify
          python3 tools/generate_cie_data.py --check
          python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Build
        run: dotnet build ChromaticityDotNet.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ChromaticityDotNet.sln --configuration Release --no-build --no-restore --logger 'console;verbosity=minimal'

      - name: Generate NuGet packages
        run: |
          for package_id in $PACKAGE_IDS; do
            dotnet pack "src/$package_id/$package_id.csproj" \
              --configuration Release --no-build --no-restore --output nupkg
          done

      - name: Read package metadata and verify all three packages
        id: package
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile

          expected_ids = os.environ['PACKAGE_IDS'].split()
          paths = list(Path('nupkg').glob('*.nupkg'))
          if len(paths) != len(expected_ids):
              raise SystemExit('Expected exactly three NuGet packages')
          shared_icon = Path('assets/branding/app-icon.png').read_bytes()
          packages = {}
          for path in paths:
              with ZipFile(path) as package:
                  nuspec, = [name for name in package.namelist() if name.endswith('.nuspec')]
                  metadata = ET.fromstring(package.read(nuspec)).find('{*}metadata')
                  package_id = metadata.findtext('{*}id')
                  version = metadata.findtext('{*}version')
                  if package_id not in expected_ids or package_id in packages or not version:
                      raise SystemExit(f'Unexpected package ID or version: {path}')
                  if path.name != f'{package_id}.{version}.nupkg':
                      raise SystemExit(f'Package filename does not match its metadata: {path}')
                  icon = metadata.findtext('{*}icon')
                  if icon != 'app-icon.png' or icon not in package.namelist():
                      raise SystemExit(f'{package_id} must include its declared app-icon.png')
                  if package.read(icon) != shared_icon:
                      raise SystemExit(f'{package_id} icon differs from the shared branding resource')
                  packages[package_id] = metadata
          versions = {metadata.findtext('{*}version') for metadata in packages.values()}
          if len(versions) != 1:
              raise SystemExit('All three NuGet packages must have the same version')
          version, = versions
          for package_id in expected_ids[1:]:
              groups = packages[package_id].findall('{*}dependencies/{*}group')
              if not groups:
                  raise SystemExit(f'{package_id} must depend on the main package')
              for group in groups:
                  dependencies = [dependency for dependency in group.findall('{*}dependency')
                                  if dependency.get('id') == expected_ids[0]]
                  if len(dependencies) != 1 or dependencies[0].get('version') != version:
                      raise SystemExit(f'{package_id} must depend on {expected_ids[0]} {version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ntag=v{version}\n')
          PY

      - name: Check GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error.txt"; then
            draft=$(jq -r '.draft' "$RUNNER_TEMP/release.json")
            echo "draft=$draft" >> "$GITHUB_OUTPUT"
            if [[ "$draft" == false ]]; then
              echo "Published release $RELEASE_TAG already exists; skipping publication."
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$(jq -r '.target_commitish' "$RUNNER_TEMP/release.json")" != "$GITHUB_SHA" ]]; then
              echo "::error::Draft $RELEASE_TAG targets another commit. Rerun its original workflow or bump the version."
              exit 1
            fi
          elif [[ "$(cat "$RUNNER_TEMP/release-error.txt")" != *"HTTP 404"* ]]; then
            cat "$RUNNER_TEMP/release-error.txt" >&2
            exit 1
          fi

          # Never associate a package with an existing tag on another commit.
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG points to another commit. Bump the project version."
              exit 1
            fi
          fi
          echo 'exists=false' >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.release.outputs.exists != 'true'
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' \
            --exclude "$RELEASE_TAG" "$GITHUB_SHA" 2>/dev/null || true)
          revision_range="$GITHUB_SHA"
          if [[ -n "$previous_tag" ]]; then
            revision_range="$previous_tag..$GITHUB_SHA"
          fi

          {
            printf '## Installation\n\n```sh\n'
            for package_id in $PACKAGE_IDS; do
              printf 'dotnet add package %s --version %s\n' "$package_id" "$PACKAGE_VERSION"
            done
            printf '```\n\n'
            for package_id in $PACKAGE_IDS; do
              printf -- '- [%s](https://www.nuget.org/packages/%s/%s)\n' \
                "$package_id" "$package_id" "$PACKAGE_VERSION"
            done
            printf '\n## Changes\n\n'
            git log --no-merges --format='- %s (%h)' "$revision_range"
            if [[ -n "$previous_tag" ]]; then
              printf '\n[Full changelog](%s/%s/compare/%s...%s)\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG"
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: NuGet login with Trusted Publishing
        if: steps.release.outputs.exists != 'true'
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: Matinx

      - name: Push NuGet packages
        if: steps.release.outputs.exists != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          for package_id in $PACKAGE_IDS; do
            dotnet nuget push "nupkg/$package_id.$PACKAGE_VERSION.nupkg" \
              --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Publish GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          EXISTING_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          prerelease=false
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            prerelease=true
          fi

          # Resume a draft left by an interrupted asset upload.
          if [[ "$EXISTING_DRAFT" == true ]]; then
            gh release upload "$RELEASE_TAG" nupkg/*.nupkg --clobber
          else
            gh release create "$RELEASE_TAG" nupkg/*.nupkg \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
