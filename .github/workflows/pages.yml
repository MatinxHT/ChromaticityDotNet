name: Browser Build and Pages Deploy

on:
  push:
    branches: [ master ]
    paths:
      - 'apps/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'CIE-DATA-NOTICE.md'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'apps/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'CIE-DATA-NOTICE.md'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install browser workload
        run: dotnet workload install wasm-tools
      - name: Test input handling and calculations
        run: dotnet test apps/Chromaticity.Tools.Tests/Chromaticity.Tools.Tests.csproj -c Release -p:GeneratePackageOnBuild=false
      - name: Test the shared library
        run: dotnet test tests/ChromaticityDotNet.Tests/ChromaticityDotNet.Tests.csproj -c Release -p:GeneratePackageOnBuild=false
      - name: Publish browser application
        run: dotnet publish apps/Chromaticity.Tools.Browser/Chromaticity.Tools.Browser.csproj -c Release -p:GeneratePackageOnBuild=false
      - name: Stage site and validate Pages asset sizes
        run: python3 apps/prepare_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-site
          path: artifacts/site
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.CLOUDFLARE_PAGES_PROJECT_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-site
          path: site
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=master
